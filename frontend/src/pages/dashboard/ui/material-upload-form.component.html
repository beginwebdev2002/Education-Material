<div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 sm:p-8">
  <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6" i18n>Upload a Teaching Material</h2>

  <div class="space-y-4">
    <div>
      <label for="material-title" class="block text-sm font-medium text-gray-700 dark:text-gray-300" i18n>Title</label>
      <input id="material-title" type="text" [value]="title()" (input)="title.set($event.target.value)"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
        placeholder="Introduction to Linear Algebra" i18n-placeholder />
    </div>

    <div>
      <label for="material-description" class="block text-sm font-medium text-gray-700 dark:text-gray-300" i18n>Description</label>
      <textarea id="material-description" rows="3" [value]="description()" (input)="description.set($any($event.target).value)"
        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
        placeholder="What does this material cover?" i18n-placeholder></textarea>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label for="material-subject" class="block text-sm font-medium text-gray-700 dark:text-gray-300" i18n>Subject</label>
        <input id="material-subject" type="text" [value]="subject()" (input)="subject.set($event.target.value)"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          placeholder="Mathematics" i18n-placeholder />
      </div>
      <div>
        <label for="material-level" class="block text-sm font-medium text-gray-700 dark:text-gray-300" i18n>Level</label>
        <input id="material-level" type="text" [value]="level()" (input)="level.set($event.target.value)"
          class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary-500 focus:ring-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white"
          placeholder="University, 1st year" i18n-placeholder />
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300" i18n>File (PDF or DOCX, max 15MB)</label>
      <input #fileInput type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        (change)="onFileSelected($event)"
        class="mt-1 block w-full text-sm text-gray-500 dark:text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100 dark:file:bg-gray-700 dark:file:text-gray-200" />
      @if (fileName()) {
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        <i class="fa-solid fa-paperclip mr-1"></i>{{ fileName() }}
        <button type="button" (click)="clearFile(fileInput)" class="ml-2 text-red-500 hover:underline" i18n>Remove</button>
      </p>
      }
      @if (fileError()) {
      <p class="mt-1 text-sm text-red-600 dark:text-red-500">{{ fileError() }}</p>
      }
    </div>

    <button type="button" (click)="submit(fileInput)" [disabled]="!isFormValid() || isSubmitting()"
      class="inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded-lg hover:bg-primary-700 focus:ring-4 focus:ring-primary-300 disabled:opacity-50 disabled:cursor-not-allowed">
      @if (isSubmitting()) {
      <i class="fa-solid fa-spinner fa-spin mr-2"></i><span i18n>Uploading...</span>
      } @else {
      <i class="fa-solid fa-upload mr-2"></i><span i18n>Upload Material</span>
      }
    </button>

    @if (successMessage()) {
    <p class="text-sm font-medium text-green-600 dark:text-green-400">{{ successMessage() }}</p>
    }
    @if (errorMessage()) {
    <p class="text-sm font-medium text-red-600 dark:text-red-400">{{ errorMessage() }}</p>
    }
  </div>
</div>
